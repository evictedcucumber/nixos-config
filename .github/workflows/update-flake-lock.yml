name: Update flake.lock

on:
  schedule:
    # 12:00 Africa/Johannesburg (UTC+2, no DST) every Tuesday
    - cron: "0 10 * * 2"
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  update-flake-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: DeterminateSystems/nix-installer-action@v3

      - name: Update flake inputs
        run: nix flake update

      - name: Verify flake still evaluates
        run: nix flake check

      - name: Open and merge flake.lock PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- flake.lock; then
            echo "flake.lock unchanged, nothing to commit."
            exit 0
          fi

          # main requires signed commits; a commit pushed straight from this
          # job would be rejected, so land the change through a PR instead —
          # the squash-merge commit GitHub creates via the API is signed by
          # GitHub itself and satisfies the ruleset.
          date="$(date -u +%Y-%m-%d)"
          branch="flake-lock-update-$date"
          message="chore(flake): sync $date"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add flake.lock
          git commit -m "$message"
          git push origin "$branch"

          gh pr create --base main --head "$branch" --title "$message" --body "Automated flake.lock update."
          gh pr merge "$branch" --squash --delete-branch --subject "$message"
